<VirtualHost *:80>
    ServerName localhost

    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
    </Directory>

    WSGIDaemonProcess videoapp user=www-data group=www-data threads=5 python-path=/app
    WSGIProcessGroup videoapp
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/wsgi.py

    <Directory /app>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>